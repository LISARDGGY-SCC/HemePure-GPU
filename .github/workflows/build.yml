name: HemePure GPU Build

on:
  push:
    branches: [ "main", "master", "HIP-CUDA-ROCM_SL" ]
  pull_request:
    branches: [ "main", "master", "HIP-CUDA-ROCM_SL" ]
  workflow_dispatch:

jobs:
  build-cuda:
    name: Build CUDA (x86_64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["", "PP", "VP"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libtirpc-dev pkg-config

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.19
      id: cuda-toolkit
      with:
        cuda: '12.6.0'
        method: 'network'

    - name: Verify CUDA Installation
      run: |
        nvcc --version
        echo "CUDA_PATH=$CUDA_PATH"

    - name: Prepare Toolchain (CMake)
      run: |
        chmod +x ./toolchain.sh
        ./toolchain.sh

        if [ ! -f env.sh ]; then
          echo "Error: env.sh was not generated."
          exit 1
        fi

    - name: Patch Script for CI Memory Limits
      run: |
        sed -i 's/ -j/ --verbose/g' FullBuild.sh
        grep "cmake --build" FullBuild.sh

    - name: Build HemePure GPU (${{ matrix.variant == '' && 'Default' || matrix.variant }})
      run: |
        chmod +x ./FullBuild.sh
        . ./env.sh

        export CC=mpicc
        export CXX=mpicxx
        export OMPI_CC=gcc
        export OMPI_CXX=g++
        export CUVER=70

        # make sure pkg-config can find OpenMPI
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH

        export CPATH="/usr/lib/x86_64-linux-gnu/openmpi/include:$CPATH"

        echo "Starting Build..."

        if [ -z "${{ matrix.variant }}" ]; then
          ./FullBuild.sh
        else
          ./FullBuild.sh "${{ matrix.variant }}"
        fi

  build-cuda-arm64:
    name: Build CUDA (aarch64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: ["", "PP", "VP"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libtirpc-dev pkg-config wget

    - name: Install CUDA Toolkit (Manual ARM64/SBSA)
      run: |
        wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get install -y cuda-toolkit-12-6

    - name: Setup CUDA Environment
      run: |
        echo "/usr/local/cuda-12.6/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=/usr/local/cuda-12.6/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "CUDA_PATH=/usr/local/cuda-12.6" >> $GITHUB_ENV

    - name: Verify CUDA Installation
      run: |
        nvcc --version
        uname -m

    - name: Prepare Toolchain (CMake)
      run: |
        chmod +x ./toolchain.sh
        ./toolchain.sh $(pwd)/toolchain 3.29.9 linux-aarch64

        if [ ! -f env.sh ]; then
          echo "Error: env.sh was not generated."
          exit 1
        fi

    - name: Patch Script for CI Memory Limits
      run: |
        sed -i 's/ -j/ --verbose/g' FullBuild.sh
        grep "cmake --build" FullBuild.sh

    - name: Build HemePure GPU (${{ matrix.variant == '' && 'Default' || matrix.variant }})
      run: |
        chmod +x ./FullBuild.sh
        . ./env.sh

        export CC=mpicc
        export CXX=mpicxx
        export OMPI_CC=gcc
        export OMPI_CXX=g++
        export CUVER=70

        export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH

        export CPATH="/usr/lib/aarch64-linux-gnu/openmpi/include:$CPATH"

        ls -d /usr/lib/aarch64-linux-gnu/openmpi/include || echo "MPI Include path not found!"

        echo "Starting Build..."

        if [ -z "${{ matrix.variant }}" ]; then
          ./FullBuild.sh
        else
          ./FullBuild.sh "${{ matrix.variant }}"
        fi
