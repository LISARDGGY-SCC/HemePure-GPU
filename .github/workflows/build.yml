name: HemePure GPU Build

on:
  push:
    branches: [ "main", "master", "HIP-CUDA-ROCM_SL" ]
  pull_request:
    branches: [ "main", "master", "HIP-CUDA-ROCM_SL" ]
  workflow_dispatch:

jobs:
  build-cuda:
    name: Build CUDA (x86_64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["", "PP", "VP"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies (OpenMPI)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libtirpc-dev

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.19
      id: cuda-toolkit
      with:
        cuda: '12.6.0'
        method: 'network'
        linux-local-args: '["--toolkit"]'

    - name: Verify CUDA Installation
      run: |
        nvcc --version
        echo "CUDA_PATH=$CUDA_PATH"

    - name: Prepare Toolchain (CMake)
      run: |
        chmod +x ./toolchain.sh
        ./toolchain.sh

        if [ ! -f env.sh ]; then
          echo "Error: env.sh was not generated."
          exit 1
        fi

    - name: Patch Script for CI Memory Limits
      run: |
        sed -i 's/ -j/ --verbose/g' FullBuild.sh
        # check that the patch was applied correctly
        grep "cmake --build" FullBuild.sh

    - name: Build HemePure GPU (${{ matrix.variant == '' && 'Default' || matrix.variant }})
      run: |
        chmod +x ./FullBuild.sh
        . ./env.sh

        export CC=mpicc
        export CXX=mpicxx
        export OMPI_CC=gcc
        export OMPI_CXX=g++
        export CUVER=70

        # make sure pkg-config can find OpenMPI
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH

        export CPATH="/usr/lib/x86_64-linux-gnu/openmpi/include:$CPATH"

        # verify that the OpenMPI include path exists
        ls -d /usr/lib/x86_64-linux-gnu/openmpi/include || echo "MPI Include path not found!"

        echo "Starting Build..."

        if [ -z "${{ matrix.variant }}" ]; then
          ./FullBuild.sh
        else
          ./FullBuild.sh "${{ matrix.variant }}"
        fi
